<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fluxo Materiais V2</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
    font-family:Arial;
    background:#111;
    color:white;
    padding:20px;
}
.card{
    background:#1e1e1e;
    padding:15px;
    margin-bottom:15px;
    border-radius:10px;
}
table{
    width:100%;
    border-collapse:collapse;
}
th,td{
    border:1px solid #333;
    padding:10px;
}
.status{
    color:#00ff88;
}
.naoideal{
    color:#ffcc00;
}
</style>
</head>

<body>

<h1>Fluxo Materiais V2</h1>

<div class="card">
<h2>Lotes</h2>
<table id="tabela">
<thead>
<tr>
<th>Lote</th>
<th>Total</th>
<th>Planejado</th>
<th>Status</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

<script>

const SUPABASE_URL = "COLE_SUA_URL";
const SUPABASE_KEY = "COLE_SUA_KEY";

const supabaseClient = supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

async function carregar(){

const { data } = await supabaseClient
.from('planejamento_lotes')
.select('*');

const tbody = document.querySelector("tbody");
tbody.innerHTML = "";

data.forEach(item => {

const parcial = item.planejado_descarregar < item.total_containers;

tbody.innerHTML += `
<tr>
<td>${item.lote}</td>
<td>${item.total_containers}</td>
<td>${item.planejado_descarregar}</td>
<td class="${parcial ? 'naoideal':'status'}">
${parcial ? 'PARCIAL (NÃO IDEAL)' : 'COMPLETO'}
</td>
</tr>
`;

});

}

carregar();

setInterval(carregar,3000);

</script>

</body>
</html>
