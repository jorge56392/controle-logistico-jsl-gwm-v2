<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sistema Logístico JSL GWM</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#0f172a;
      color:white;
    }

    header{
      background:#111827;
      padding:20px;
      border-bottom:2px solid #1e293b;
    }

    header h1{
      font-size:28px;
      color:#38bdf8;
    }

    .container{
      padding:20px;
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:20px;
      margin-top:20px;
    }

    .card{
      background:#1e293b;
      padding:20px;
      border-radius:12px;
      border:1px solid #334155;
      transition:0.3s;
    }

    .card:hover{
      transform:translateY(-5px);
      border-color:#38bdf8;
    }

    .card h2{
      margin-bottom:10px;
      color:#38bdf8;
    }

    .status{
      margin-top:10px;
      padding:8px;
      border-radius:8px;
      display:inline-block;
      font-weight:bold;
    }

    .ok{
      background:#14532d;
      color:#4ade80;
    }

    .alert{
      background:#7f1d1d;
      color:#f87171;
    }

    table{
      width:100%;
      margin-top:30px;
      border-collapse:collapse;
      background:#1e293b;
      overflow:hidden;
      border-radius:12px;
    }

    th, td{
      padding:15px;
      border-bottom:1px solid #334155;
      text-align:left;
    }

    th{
      background:#0f172a;
      color:#38bdf8;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      gap:10px;
    }

    button{
      background:#38bdf8;
      color:#0f172a;
      border:none;
      padding:10px 20px;
      border-radius:8px;
      font-weight:bold;
      cursor:pointer;
    }

    button:hover{
      opacity:0.9;
    }
  </style>
</head>

<body>

<header>
  <div class="topbar">
    <h1>Sistema Logístico JSL GWM</h1>
    <button>Atualizar Painel</button>
  </div>
</header>

<div class="container">

  <div class="cards">

    <div class="card">
      <h2>Portaria</h2>
      <p>Caminhões aguardando:</p>
      <div class="status alert">12 caminhões</div>
    </div>

    <div class="card">
      <h2>Recebimento</h2>
      <p>Docas em operação:</p>
      <div class="status ok">140B ativa</div>
    </div>

    <div class="card">
      <h2>Unpacking</h2>
      <p>Caixas processadas:</p>
      <div class="status ok">248 caixas</div>
    </div>

    <div class="card">
      <h2>Produção</h2>
      <p>Status da linha:</p>
      <div class="status ok">Linha rodando</div>
    </div>

  </div>

  <table>
    <thead>
      <tr>
        <th>Lote</th>
        <th>Doca</th>
        <th>Status</th>
        <th>Responsável</th>
      </tr>
    </thead>

    <tbody>
      <tr>
        <td>BHE4060</td>
        <td>140
